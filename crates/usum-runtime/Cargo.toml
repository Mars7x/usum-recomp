[package]
name = "usum-runtime"
description = "The native runtime translated game code runs on (bring-up stage)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
usum-import.workspace = true
usum-guest.workspace = true
sha2.workspace = true
rayon.workspace = true
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
pulseaudio = { workspace = true, optional = true }
usum-render = { workspace = true, optional = true }

[features]
# the play window (play.rs); off by default so tests and the probe build
# without a window system
window = ["dep:winit", "dep:softbuffer", "dep:pulseaudio"]
# Immutable shaded-draw snapshots for the opt-in Vulkan comparison path.
# The software renderer remains authoritative and this is off by default.
vulkan-compare = ["dep:usum-render"]

[[example]]
name = "vulkan-compare-smoke"
required-features = ["vulkan-compare"]

[[example]]
name = "vertex-shader-smoke"
required-features = ["vulkan-compare"]

[lints]
workspace = true
